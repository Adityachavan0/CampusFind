<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusFind - Manage Items</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body class="bg-light">


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="admin.html">

                CampusFind Admin

            </a>


            <div>

                <a
                    href="admin.html"
                    class="btn btn-outline-light btn-sm me-2">

                    Dashboard

                </a>


                <a
                    href="admin-users.html"
                    class="btn btn-outline-light btn-sm me-2">

                    Users

                </a>


                <a
                    href="admin-reports.html"
                    class="btn btn-outline-light btn-sm me-2">

                    Reports

                </a>


                <button
                    id="logoutBtn"
                    class="btn btn-light btn-sm">

                    Logout

                </button>

            </div>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <div class="container py-5">


        <!-- Header -->

        <div
            class="d-flex justify-content-between
                   align-items-center mb-4">

            <div>

                <h2>
                    Manage Items
                </h2>

                <p class="text-muted mb-0">

                    View and manage all lost and found reports.

                </p>

            </div>


            <button
                id="refreshBtn"
                class="btn btn-primary">

                🔄 Refresh

            </button>

        </div>


        <!-- ================= FILTERS ================= -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <div class="row g-3">


                    <!-- Search -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Search
                        </label>

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search item...">

                    </div>


                    <!-- Type -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Item Type
                        </label>

                        <select
                            id="typeFilter"
                            class="form-select">

                            <option value="ALL">
                                All
                            </option>

                            <option value="LOST">
                                Lost
                            </option>

                            <option value="FOUND">
                                Found
                            </option>

                        </select>

                    </div>


                    <!-- Approval -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Approval Status
                        </label>

                        <select
                            id="approvalFilter"
                            class="form-select">

                            <option value="ALL">
                                All
                            </option>

                            <option value="PENDING">
                                Pending
                            </option>

                            <option value="APPROVED">
                                Approved
                            </option>

                            <option value="REJECTED">
                                Rejected
                            </option>

                        </select>

                    </div>


                    <!-- Item Status -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Item Status
                        </label>

                        <select
                            id="statusFilter"
                            class="form-select">

                            <option value="ALL">
                                All
                            </option>

                            <option value="ACTIVE">
                                Active
                            </option>

                            <option value="MATCHED">
                                Matched
                            </option>

                            <option value="RECOVERED">
                                Recovered
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </div>


        <!-- ================= ITEM COUNT ================= -->

        <div class="mb-3">

            <span
                id="itemCount"
                class="badge bg-primary">

                0 Items

            </span>

        </div>


        <!-- ================= TABLE ================= -->

        <div class="card shadow-sm border-0">

            <div class="card-body">

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle">

                        <thead class="table-dark">

                            <tr>

                                <th>
                                    Image
                                </th>

                                <th>
                                    Item
                                </th>

                                <th>
                                    Type
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Location
                                </th>

                                <th>
                                    Approval
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="itemsTable">

                        </tbody>

                    </table>

                </div>


                <div
                    id="noItems"
                    class="text-center text-muted py-4 d-none">

                    No items found.

                </div>

            </div>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script
        type="module"
        src="js/admin-items.js">
    </script>

</body>

</html>
