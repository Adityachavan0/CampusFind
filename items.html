<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFind - Lost & Found Items</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="dashboard.html">
                CampusFind
            </a>

            <a href="dashboard.html" class="btn btn-light btn-sm">
                Dashboard
            </a>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <div class="container py-5">

        <h2 class="text-center mb-4">
            Lost & Found Items
        </h2>

        <p class="text-center text-muted mb-4">
            Search for an item reported on campus.
        </p>


        <!-- ================= SEARCH ================= -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <div class="row g-3">

                    <!-- Search -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Search
                        </label>

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search item...">

                    </div>


                    <!-- Type -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Item Type
                        </label>

                        <select
                            id="typeFilter"
                            class="form-select">

                            <option value="ALL">
                                All
                            </option>

                            <option value="LOST">
                                Lost
                            </option>

                            <option value="FOUND">
                                Found
                            </option>

                        </select>

                    </div>


                    <!-- Category -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            id="categoryFilter"
                            class="form-select">

                            <option value="ALL">
                                All Categories
                            </option>

                        </select>

                    </div>


                    <!-- Location -->

                    <div class="col-md-3">

                        <label class="form-label">
                            Location
                        </label>

                        <select
                            id="locationFilter"
                            class="form-select">

                            <option value="ALL">
                                All Locations
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </div>


        <!-- ================= RESULTS COUNT ================= -->

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h5>
                Available Items
            </h5>

            <span
                id="resultCount"
                class="badge bg-primary">
                0 Items
            </span>

        </div>


        <!-- ================= ITEMS ================= -->

        <div
            id="itemsContainer"
            class="row g-4">

        </div>


        <!-- ================= NO RESULTS ================= -->

        <div
            id="noItems"
            class="text-center py-5"
            style="display: none;">

            <div class="fs-1">
                🔍
            </div>

            <h4>
                No items found
            </h4>

            <p class="text-muted">
                Try changing your search or filters.
            </p>

        </div>

    </div>


    <script
        type="module"
        src="js/items.js">
    </script>

</body>

</html>
