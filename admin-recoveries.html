<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusFind - Recoveries</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="admin.html">

                CampusFind Admin

            </a>

            <div>

                <a
                    href="admin.html"
                    class="btn btn-outline-light btn-sm me-2">

                    Dashboard

                </a>

                <button
                    id="logoutBtn"
                    class="btn btn-light btn-sm">

                    Logout

                </button>

            </div>

        </div>

    </nav>


    <div class="container py-5">

        <div class="d-flex justify-content-between
                    align-items-center mb-4">

            <div>

                <h2>
                    Recovery Requests
                </h2>

                <p class="text-muted">
                    Review possible item recoveries.
                </p>

            </div>

            <button
                id="refreshBtn"
                class="btn btn-primary">

                Refresh

            </button>

        </div>


        <div class="card shadow-sm border-0">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                            <tr>

                                <th>Item</th>

                                <th>Matched Item</th>

                                <th>Owner</th>

                                <th>Finder</th>

                                <th>Status</th>

                                <th>Date</th>

                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="recoveryTable">

                        </tbody>

                    </table>

                </div>


                <div
                    id="noRecoveries"
                    class="text-center text-muted py-4 d-none">

                    No recovery requests found.

                </div>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="js/admin-recoveries.js">
    </script>

</body>

</html>
