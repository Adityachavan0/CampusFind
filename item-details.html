<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFind - Item Details</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="dashboard.html">
                CampusFind
            </a>

            <div>
                <a href="items.html" class="btn btn-light btn-sm me-2">
                    Back to Items
                </a>

                <a href="dashboard.html" class="btn btn-outline-light btn-sm">
                    Dashboard
                </a>
            </div>

        </div>

    </nav>


    <!-- ================= ITEM DETAILS ================= -->

    <div class="container py-5">

        <div id="loading" class="text-center py-5">

            <div class="spinner-border text-primary"></div>

            <p class="mt-3">
                Loading item details...
            </p>

        </div>


        <div id="errorMessage" class="alert alert-danger d-none">
        </div>


        <div id="itemDetails" class="row justify-content-center d-none">

            <div class="col-lg-9">

                <div class="card shadow border-0 overflow-hidden">

                    <div class="row g-0">

                        <!-- ================= IMAGE ================= -->

                        <div class="col-md-6">

                            <div
                                class="h-100 d-flex justify-content-center align-items-center bg-light">

                                <img
                                    id="itemImage"
                                    src=""
                                    alt="Item Image"
                                    class="img-fluid"
                                    style="
                                        width: 100%;
                                        height: 450px;
                                        object-fit: cover;
                                    ">

                                <div
                                    id="noImage"
                                    class="text-center d-none">

                                    <div class="fs-1">
                                        📦
                                    </div>

                                    <p class="text-muted">
                                        No image available
                                    </p>

                                </div>

                            </div>

                        </div>

                        
                        <!-- ================= INFORMATION ================= -->

                        <div class="col-md-6">

                            <div class="card-body p-4">

                                <!-- Badge -->

                                <div class="mb-3">

                                    <span
                                        id="itemType"
                                        class="badge">
                                    </span>

                                    <span
                                        id="itemStatus"
                                        class="badge bg-secondary ms-2">
                                    </span>

                                </div>


                                <!-- Item Name -->

                                <h2
                                    id="itemName"
                                    class="fw-bold">
                                </h2>


                                <!-- Description -->

                                <h6 class="mt-4">
                                    Description
                                </h6>

                                <p
                                    id="itemDescription"
                                    class="text-muted">
                                </p>


                                <!-- Details -->

                                <hr>

                                <div class="mb-3">

                                    <strong>
                                        📂 Category
                                    </strong>

                                    <p
                                        id="itemCategory"
                                        class="text-muted mb-0">
                                    </p>

                                </div>


                                <div class="mb-3">

                                    <strong>
                                        📍 Location
                                    </strong>

                                    <p
                                        id="itemLocation"
                                        class="text-muted mb-0">
                                    </p>

                                </div>


                                <div class="mb-3">

                                    <strong>
                                        📅 Date
                                    </strong>

                                    <p
                                        id="itemDate"
                                        class="text-muted mb-0">
                                    </p>

                                </div>


                                <div class="mb-3">

                                    <strong>
                                        🕐 Time
                                    </strong>

                                    <p
                                        id="itemTime"
                                        class="text-muted mb-0">
                                    </p>

                                </div>


                                <!-- Action -->

                                <div class="mt-4">

                                    <button
                                        id="actionBtn"
                                        class="btn btn-primary w-100"
                                        type="button">

                                        Report / Contact Admin

                                    </button>

                                </div>

                                <p
                                    class="small text-muted text-center mt-3 mb-0">

                                    CampusFind helps students safely
                                    recover lost and found items.

                                </p>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <!-- ================= POSSIBLE MATCHES ================= -->

<div
    id="matchesSection"
    class="container py-5">

    <div class="col-lg-9">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h3 class="mb-2">
                    🔎 Possible Matches
                </h3>

                <p class="text-muted">
                    Items that may match this report.
                </p>

                <div
                    id="matchesContainer"
                    class="row g-4">
                </div>

            </div>

        </div>

    </div>

</div>

    <script
        type="module"
        src="js/item-details.js">
    </script>

</body>

</html>
