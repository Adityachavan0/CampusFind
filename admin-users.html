<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFind - Manage Users</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="admin.html">
                CampusFind Admin
            </a>

            <div>

                <a
                    href="admin.html"
                    class="btn btn-outline-light btn-sm me-2">
                    Dashboard
                </a>

                <button
                    id="logoutBtn"
                    class="btn btn-light btn-sm">
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- MAIN -->

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2>
                    Manage Users
                </h2>

                <p class="text-muted mb-0">
                    View and manage CampusFind users.
                </p>

            </div>

            <button
                id="refreshBtn"
                class="btn btn-primary">
                Refresh
            </button>

        </div>


        <!-- SEARCH -->

        <div class="card shadow-sm border-0 mb-4">

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">
                            Search User
                        </label>

                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Name, Student ID or Email">

                    </div>

                </div>

            </div>

        </div>


        <!-- USER TABLE -->

        <div class="card shadow-sm border-0">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                            <tr>
                                <th>Name</th>
                                <th>Student ID</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Points</th>
                                <th>Created</th>
                                <th>Action</th>
                            </tr>

                        </thead>

                        <tbody id="usersTable">

                        </tbody>

                    </table>

                </div>


                <div
                    id="noUsers"
                    class="text-center text-muted py-4 d-none">

                    No users found.

                </div>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="js/admin-users.js">
    </script>

</body>

</html>
