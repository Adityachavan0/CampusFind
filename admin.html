<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFind - Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="admin.html">
                CampusFind Admin
            </a>

            <div>
                <span class="text-white me-3">
                    Admin
                </span>
                <a
    href="admin-users.html"
    class="btn btn-dark me-2">
    👥 Manage Users
</a>
<a
    href="admin-items.html"
    class="btn btn-primary me-2">
    📦 Manage Items
</a>
<a
    href="admin-reports.html"
    class="btn btn-warning me-2">

    🚩 Reports

</a>
<a
    href="admin-recoveries.html"
    class="btn btn-success me-2">

    🤝 Recoveries

</a>
                <button
                    id="logoutBtn"
                    class="btn btn-outline-light btn-sm">
                    Logout
                </button>
            </div>

        </div>

    </nav>


    <!-- ================= DASHBOARD ================= -->

    <div class="container py-5">

        <div class="mb-4">

            <h2>
                Admin Dashboard
            </h2>

            <p class="text-muted">
                Manage CampusFind lost and found reports.
            </p>

        </div>


        <!-- ================= STATISTICS ================= -->

        <div class="row g-4 mb-5">

            <div class="col-md-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">

                        <div class="fs-1">
                            📦
                        </div>

                        <h6 class="text-muted">
                            Total Items
                        </h6>

                        <h2 id="totalItems">
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">

                        <div class="fs-1">
                            ⏳
                        </div>

                        <h6 class="text-muted">
                            Pending
                        </h6>

                        <h2 id="pendingItems">
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">

                        <div class="fs-1">
                            🔴
                        </div>

                        <h6 class="text-muted">
                            Lost
                        </h6>

                        <h2 id="lostItems">
                            0
                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card shadow-sm border-0">

                    <div class="card-body text-center">

                        <div class="fs-1">
                            🟢
                        </div>

                        <h6 class="text-muted">
                            Found
                        </h6>

                        <h2 id="foundItems">
                            0
                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <!-- ================= PENDING ITEMS ================= -->

        <div class="card shadow-sm border-0">

            <div class="card-header bg-white">

                <div class="d-flex justify-content-between align-items-center">

                    <h5 class="mb-0">
                        Pending Reports
                    </h5>

                    <button
                        id="refreshBtn"
                        class="btn btn-primary btn-sm">
                        Refresh
                    </button>

                </div>

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>Image</th>

                                <th>Type</th>

                                <th>Item</th>

                                <th>Category</th>

                                <th>Location</th>

                                <th>Date</th>

                                <th>Action</th>

                            </tr>

                        </thead>

                        <tbody id="pendingTable">

                        </tbody>

                    </table>

                </div>


                <div
                    id="noPending"
                    class="text-center text-muted py-4 d-none">

                    No pending reports.

                </div>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="js/admin.js">
    </script>

</body>

</html>
