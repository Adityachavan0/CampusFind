<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFind - Report Lost Item</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" href="dashboard.html">
                CampusFind
            </a>

            <a href="dashboard.html" class="btn btn-light btn-sm">
                Dashboard
            </a>

        </div>
    </nav>


    <!-- Form -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <h2 class="text-center text-danger mb-2">
                            Report Lost Item
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Enter details about the item you lost.
                        </p>


                        <form id="lostItemForm">

                            <!-- Item Name -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Item Name *
                                </label>

                                <input
                                    type="text"
                                    id="itemName"
                                    class="form-control"
                                    placeholder="Example: Samsung Mobile"
                                    required>

                            </div>


                            <!-- Category -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Category *
                                </label>

                                <select
                                    id="category"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Category
                                    </option>

                                </select>

                            </div>


                            <!-- Description -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Description *
                                </label>

                                <textarea
                                    id="description"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Describe the item, color, model, identifying marks, etc."
                                    required>
                                </textarea>

                            </div>


                            <!-- Location -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Where did you lose it? *
                                </label>

                                <select
                                    id="location"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Location
                                    </option>

                                </select>

                            </div>


                            <!-- Date -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Lost Date *
                                </label>

                                <input
                                    type="date"
                                    id="itemDate"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- Time -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Approximate Time
                                </label>

                                <input
                                    type="time"
                                    id="itemTime"
                                    class="form-control">

                            </div>


                            <!-- Image -->
                            <div class="mb-4">

                                <label class="form-label">
                                    Item Image
                                </label>

                                <input
                                    type="file"
                                    id="itemImage"
                                    class="form-control"
                                    accept="image/*">

                                <small class="text-muted">
                                    Image upload will be connected to
                                    Supabase Storage next.
                                </small>

                            </div>


                            <!-- Submit -->
                            <button
                                type="submit"
                                class="btn btn-danger w-100">

                                Submit Lost Item

                            </button>

                        </form>


                        <!-- Message -->
                        <div
                            id="message"
                            class="text-center mt-3">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="js/lost-item.js">
    </script>

</body>

</html>
