<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CampusFind - Leaderboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body class="bg-light">


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="dashboard.html">

                CampusFind

            </a>


            <div>

                <a
                    href="dashboard.html"
                    class="btn btn-light btn-sm">

                    Dashboard

                </a>

            </div>

        </div>

    </nav>



    <!-- ================= MAIN ================= -->

    <div class="container py-5">


        <div class="text-center mb-5">

            <div class="fs-1">
                🏆
            </div>

            <h2 class="fw-bold">
                CampusFind Leaderboard
            </h2>

            <p class="text-muted">
                Students who help recover lost items earn points.
            </p>

        </div>



        <!-- ================= TOP THREE ================= -->

        <div
            id="topStudents"
            class="row justify-content-center g-4 mb-5">

        </div>



        <!-- ================= ALL STUDENTS ================= -->

        <div class="card shadow-sm border-0">

            <div class="card-body">

                <h4 class="mb-4">
                    All Students
                </h4>


                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                            <tr>

                                <th>
                                    Rank
                                </th>

                                <th>
                                    Student
                                </th>

                                <th>
                                    Student ID
                                </th>

                                <th>
                                    Points
                                </th>

                            </tr>

                        </thead>


                        <tbody id="leaderboardTable">

                        </tbody>

                    </table>

                </div>


                <div
                    id="noStudents"
                    class="text-center text-muted py-4 d-none">

                    No students found.

                </div>

            </div>

        </div>

    </div>



    <script
        type="module"
        src="js/leaderboard.js">
    </script>

</body>

</html>
